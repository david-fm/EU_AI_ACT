[project]
name = "eu-ai-act"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fairlearn>=0.12.0",
    "graphviz==0.21",
    "jax>=0.4.30,<0.5.0",
    "jupyterlab==4.5.0",
    "keras==3.12.0",
    "matplotlib==3.10.7",
    "notebook==7.5.0",
    "pydot>=4.0.1",
    "pydotplus>=2.0.2",
    "tensorflow-macos>=2.16.0",
    "tensorflow-datasets==4.9.9",
    "tensorflow-metal>=1.2.0",
    "visualkeras==0.2.0",
    "scikit-learn>=1.8.0",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "kagglehub[polars-datasets]>=1.0.0",
    "kaggle>=2.0.1",
    "polars>=1.39.3",
    "torch>=2.11.0",
    "reportlab>=4.4.10",
    "agno>=1.0.0",
    "openai>=2.36.0",
]

[project.optional-dependencies]
torch = ["torch>=2.4.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
eu-ai-act = "eu_ai_act.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eu_ai_act"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/eu_ai_act --cov-report=term-missing --cov-fail-under=80"

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-cov>=6.0.0"]
